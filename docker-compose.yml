version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: atmos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atmos_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atmos_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  ranks-registry:
    build: .
    container_name: ranks_registry_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/atmos_crm
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
